  <!-- Background Squircle -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#fav-bg)" stroke="#38bdf8" stroke-width="2.5" />

  <!-- Wi-Fi Spout Arcs (Thick for Small Icon Legibility) -->
