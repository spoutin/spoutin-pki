  <!-- Whale Fluke Base -->
  <path d="M 64 82
           C 55 74, 35 70, 18 76
           C 15 77, 14 80, 16 83
           C 25 92, 44 100, 59 114
           L 69 114
           C 84 100, 103 92, 112 83
           C 114 80, 113 77, 110 76
