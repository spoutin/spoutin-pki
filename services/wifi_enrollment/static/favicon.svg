  <path d="M 42 47 A 31 31 0 0 1 86 47" fill="none" stroke="#38bdf8" stroke-width="7" stroke-linecap="round" />
  <path d="M 52 60 A 17 17 0 0 1 76 60" fill="none" stroke="#67e8f9" stroke-width="6" stroke-linecap="round" />

  <!-- Central Transmitter Core -->
